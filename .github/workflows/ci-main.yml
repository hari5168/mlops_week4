name: CI - Main Branch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install google-cloud-storage
      
      - name: Authenticate with Google Cloud
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          echo "$GCP_SERVICE_ACCOUNT_KEY" > key.json
          export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/key.json
          gcloud auth activate-service-account --key-file=key.json
          gcloud config set project secure-portal-472706-j8
          gcloud auth list
      
      - name: Pull data & model from DVC
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/key.json
        run: |
          dvc pull
      
      - name: Run tests
        id: pytest
        continue-on-error: true
        run: |
          pytest --maxfail=1 --disable-warnings -v | tee results.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
      
      - name: Create test report
        if: always()
        run: |
          echo "## 🧪 CI Results - Main Branch" > report.md
          echo "" >> report.md
          echo "**Status:** ${{ steps.pytest.outputs.exit_code == '0' && '✅ Passed' || '❌ Failed' }}" >> report.md
          echo "" >> report.md
          echo "### Test Output" >> report.md
          echo '```' >> report.md
          cat results.txt >> report.md
          echo '```' >> report.md
      
      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
      
      - name: Fail if tests failed
        if: steps.pytest.outputs.exit_code != '0'
        run: exit 1
